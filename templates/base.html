<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="campaign-id" content="{{ campaign_id | default('d00ca9db-6544-46ae-a8d4-c6de76d5bfba') }}">
  <title>{% block title %}Console campagne Orbit{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='css/orbit-v5.css') if url_for is defined else '/static/css/orbit-v5.css' }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/console.css') if url_for is defined else '/static/css/console.css' }}">
  {% block head %}{% endblock %}
</head>
<body>
  <main class="orbit-console">
    {% block content %}{% endblock %}
  </main>
  <div class="orbit-toast-host" id="toast-host" aria-live="polite" aria-atomic="true"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
